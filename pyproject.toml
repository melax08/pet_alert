[project]
name = "pet-alert"
version = "1.2.0"
description = "A web application that allows people to search for missing animals and report those found"
readme = "README.md"
requires-python = "==3.14.4"
authors = ["Ilya Malashenko (github: melax08)"]
dependencies = [
    "aiogram==3.27.0",
    "celery==5.6.3",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "django==6.0.4",
    "django-celery-results==2.6.0",
    "django-cors-headers==4.9.0",
    "django-csp==4.0",
    "django-filter==25.2",
    "django-http-referrer-policy==1.1.1",
    "django-permissions-policy==4.29.0",
    "django-phonenumber-field==8.4.0",
    "django-polymorphic==4.11.2",
    "django-recaptcha==4.1.0",
    "django-redis==6.0.0",
    "django-registration==5.2.1",
    "django-split-settings==1.3.2",
    "django-structlog==10.0.0",
    "djangorestframework==3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "djoser==2.3.3",
    "gunicorn==25.3.0",
    "phonenumberslite==9.0.29",
    "pillow==12.2.0",
    "psycopg2-binary==2.9.12",
    "python-decouple==3.8",
    "redis==7.4.0",
    "sentry-sdk[django]==2.58.0",
    "setuptools==82.0.1",
    "sorl-thumbnail==13.0.0",
    "uvicorn[standard]==0.46.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar==6.3.0",
    "django-extra-checks==0.16.1",
    "django-querycount==0.8.3",
    "django-test-migrations==1.5.0",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-django==4.12.0",
    "ruff==0.15.12",
]

[tool.ruff]
indent-width = 4
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM"  # flake8-simplify
]

[tool.ruff.format]
line-ending = "lf"
