{% with request.resolver_match.view_name as view_name %}
  <section class="filter-bar">
    <div class="segmented">
      <a href="{% url 'ads:add_lost' %}" class="btn {% if view_name == 'ads:add_lost' %}btn-pa-green{% else %}btn-secondary{% endif %}">Потерялся</a>
      <a href="{% url 'ads:add_found' %}" class="btn {% if view_name == 'ads:add_found' %}btn-pa-green{% else %}btn-secondary{% endif %}">Нашёлся</a>
    </div>
    <a href="{% url 'ads:advertisement_list' %}" class="btn btn-outline-pa-green">Объявления</a>
  </section>
{% endwith %}
