{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{% static 'img/fav/favicon.ico' %}" type="image">
  <link rel="apple-touch-icon" sizes="180x180"
        href="{% static 'img/fav/apple-touch-icon.png' %}">
  <link rel="icon" type="image/png" sizes="32x32"
        href="{% static 'img/fav/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16"
        href="{% static 'img/fav/favicon-16x16.png' %}">
  <meta name="msapplication-TileColor" content="#000">
  <meta name="theme-color" content="#1F8A7E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/pa-styles.css' %}">
  <script defer src="{% static 'js/ui.js' %}"></script>
  <title>
    {% block title %}
      Здесь нет никакого title, уходите!
    {% endblock %}
  </title>
</head>
<body>
<header class="site-header">
  {% include 'includes/header.html' %}
</header>
<main>
  <div class="container page-shell">
    {% block content %}
      Контент не подвезли :(((
    {% endblock %}
  </div>
</main>
<footer class="site-footer">
  <div class="site-footer__inner">
    {% include 'includes/footer.html' %}
  </div>
</footer>
</body>
</html>
